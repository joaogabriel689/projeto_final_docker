services:
  api:
    build: ./api
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/health | grep -q 'healthy' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    volumes:
      -./api:/api
    environment:
      DATABASE_URL: 'mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?charset=utf8mb4'
    networks:
      - banco_dados
      - backend

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/entrypoint.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $MYSQL_USER -p$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banco_dados

  php:
    build: ./php
    container_name: php
    restart: always
    volumes:
      -./php:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - URL_API=${URL_API}
    networks:
      - backend
      - frontend

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./php:/var/www/html
      - ./nginx/style.css:/var/www/html/public/style.css:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - frontend


  alpine:
    build:
      context: ./alpine
    container_name: mysql_backup_cron
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD}
    networks:
      - banco_dados
    volumes:
      - ./alpine/backups:/backups

volumes:
  mysql_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  banco_dados:
    internal: true
    driver: bridge
