services:
  api:
    build: ./api
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/health | grep -q 'healthy' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    environment:
      DATABASE_URL: 'mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?charset=utf8mb4'
    volumes:
      - ./logs/api:/var/log/api
    networks:
      - banco_dados
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  db:
    build: 
      context: ./mysql
    restart: unless-stopped
    command: >
      --mysql-native-password=ON
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --log-error=/var/log/mysql/error.log
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banco_dados
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  php:
    build: ./php
    container_name: php
    restart: always
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      - URL_API=${URL_API}
    volumes:
      - ./php:/var/www/html
      - ./logs/php-fpm:/var/log/php-fpm
    networks:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./php:/var/www/html
      - ./nginx/style.css:/var/www/html/public/style.css:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php
    networks:
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  alpine:
    build:
      context: ./alpine
    container_name: mysql_backup_cron
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nginx:
        condition: service_started
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD}
      TARGET_URL: ${BASE_URL}
    networks:
      - frontend
      - banco_dados
    volumes:
      - ./alpine/backups:/backups
      - ./logs/alpine:/var/log/alpine
      - ./alpine/results:/results
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - monitoring

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    ports:
      - "8081:8080"

    networks:
      - monitoring

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - monitoring

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M


volumes:
  mysql_data:
  prometheus_data:
  grafana_data:


networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  banco_dados:
    internal: true
    driver: bridge
  monitoring:
    driver: bridge